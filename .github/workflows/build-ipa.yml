name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild -project XingyeTest.xcodeproj \
            -target XingyeTest \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build | tail -30

      - name: Package unsigned IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/XingyeTest.app"
          test -d "$APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry XingyeTest-unsigned.ipa Payload
          ls -la XingyeTest-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: XingyeTest-unsigned-ipa
          path: XingyeTest-unsigned.ipa
          retention-days: 30
